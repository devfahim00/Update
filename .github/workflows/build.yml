name: Build

concurrency: 
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '*.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          path: "src"
          fetch-depth: 0

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"
          fetch-depth: 0
        continue-on-error: true
      
      - name: Clean old builds
        run: |
          mkdir -p $GITHUB_WORKSPACE/builds
          rm -f $GITHUB_WORKSPACE/builds/*.cs3 || true
          rm -f $GITHUB_WORKSPACE/builds/plugins.json || true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew assembleDebug
          # Create .cs3 files manually
          bash generate_cs3.sh
          # Copy files to builds
          cp -f plugin.cs3 $GITHUB_WORKSPACE/builds/ || true
          cp -f repo.cs3 $GITHUB_WORKSPACE/builds/ || true
          # Copy APK if exists
          find app/build/outputs/apk -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/builds/ \; || true

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          if [ ! -d ".git" ]; then
            git init
            git checkout -b builds
            git remote add origin https://github.com/${{ github.repository }}.git
          fi
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Build $GITHUB_SHA"
          git push --force origin builds
